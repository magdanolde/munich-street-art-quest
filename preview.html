FE0F",color:f.mint,tint:"#dcfbef",points:75}},Ae=[{id:"all",label:"All",emoji:"\u2728"},{id:"pixel",label:"Pixel Mosaics",emoji:"\u{1F47E}"},{id:"mural",label:"Mega Murals",emoji:"\u{1F3A8}"},{id:"legal",label:"Legal Walls",emoji:"\u{1F3DB}\uFE0F"}],ue=[{min:0,title:"Rookie Spotter"},{min:.15,title:"Wall Whisperer"},{min:.4,title:"Pixel Hunter"},{min:.7,title:"Spray Sage"},{min:1,title:"MUC Legend"}],Q=["Detecting pixel tiles\u2026","Matching motif fingerprint\u2026","Cross-checking GPS zone\u2026","Consulting the lore archive\u2026"],v="border-[3px] border-[#141024]",j="shadow-[3px_3px_0_#141024]",$=`mq-press ${v} ${j}`,S=[{id:"sendlinger-tor",name:"Sendlinger Tor",motif:"Pretzel & M\xFCnchner Kindl",lat:48.134,lng:11.5676,district:"Old Town",category:"pixel",hint:"Look up around the medieval gate where the Altstadt ring meets the U-Bahn hub.",trivia:"Sendlinger Tor is one of three gates that survive from Munich\u2019s old city wall.",lore:"The gate was built in the 14th century to guard the road south to the village of Sendling. In the early 1900s its passages were merged into one wide arch for traffic, leaving the two hexagonal side towers you see today. The M\xFCnchner Kindl \u2014 the little hooded monk on the city\u2019s coat of arms \u2014 has stood for Munich since the Middle Ages, so a pretzel-and-Kindl mosaic here is pure hometown pride."},{id:"viktualienmarkt",name:"Viktualienmarkt",motif:"Green Apple & Pretzel",lat:48.1351,lng:11.5761,district:"Old Town",category:"pixel",hint:"Hunt among the market stalls, close to the blue-and-white maypole.",trivia:"Munich\u2019s favourite food market moved here from Marienplatz in 1807.",lore:"King Max I Joseph ordered the farmers\u2019 market out of the crowded Marienplatz in 1807, and it has grown ever since into a maze of stalls selling radishes, cheese, flowers and Wei\xDFwurst. The beer garden rotates between Munich\u2019s big breweries, and little fountains honour local folk comedians like Karl Valentin and Liesl Karlstadt. An apple-and-pretzel mosaic is basically the market\u2019s menu in pixels."},{id:"alte-utting",name:"Alte Utting",motif:"Bridge Pretzel",lat:48.1235,lng:11.5562,district:"Sendling",category:"pixel",hint:"Find the ship that is parked on a railway bridge. Yes, really.",trivia:"A retired Ammersee passenger ship sits high on an old railway bridge as a bar and culture venue.",lore:"The MS Utting carried passengers across the Ammersee for decades. Instead of scrapping her, a crew of Munich culture makers hauled the ship across the city on a heavy-load transporter and craned her onto a disused railway bridge in the Schlachthof quarter. Today she is a deck bar, club and event space \u2014 and a pretzel mosaic on a bridge with a boat on top is about as Munich-surreal as it gets."},{id:"goetheplatz",name:"Goetheplatz",motif:"Pac-Man with Beer Mug",lat:48.1298,lng:11.5585,district:"Ludwigsvorstadt",category:"pixel",hint:"Circle the square above the U3/U6 station, a short walk south of the Wiesn.",trivia:"The square is named after Goethe and sits a few minutes from the Oktoberfest grounds.",lore:"Ludwigsvorstadt grew outside the old city walls in the 19th century and still has the Theresienwiese \u2014 home of Oktoberfest \u2014 on its doorstep. A pellet-chomping arcade hero from 1980 hoisting a Ma\xDF mug is the perfect mash-up of retro gaming and the world\u2019s biggest folk festival."},{id:"rotkreuzplatz",name:"Rotkreuzplatz",motif:"Mario Piranha Plant",lat:48.1528,lng:11.5332,district:"Neuhausen",category:"pixel",hint:"Search the busy square in the heart of Neuhausen, near the U1 entrance.",trivia:"The square takes its name from the Red Cross hospital founded nearby.",lore:"Neuhausen was its own village until Munich absorbed it in 1890. Its central square is named after the Rotkreuzklinikum, the Red Cross hospital in the neighbourhood. Today it is a buzzing local hub of caf\xE9s and ice-cream queues \u2014 a sneaky spot for a pixel plant to pop out of a pipe."},{id:"thalkirchner-str",name:"Thalkirchner Str.",motif:"Rainbow Invader",lat:48.1285,lng:11.5642,district:"Glockenbach",category:"pixel",hint:"Stroll the street that runs past the Old Southern Cemetery toward Glockenbach.",trivia:"Glockenbachviertel is named after a stream once used by the city\u2019s bell founders.",lore:"The Glockenbach (\u201Cbell brook\u201D) took its name from the bell foundries that once worked along its banks. The streams were later covered over, and the quarter became one of Munich\u2019s most colourful nightlife areas and the heart of its LGBTQ+ scene. A rainbow alien could not have picked a better home."},{id:"theresienstrasse",name:"Theresienstra\xDFe",motif:"Heating Plant Giant",lat:48.1492,lng:11.5731,district:"Maxvorstadt",category:"pixel",hint:"Scan building corners between the university quarter and the Pinakotheken.",trivia:"The street honours Princess Therese, whose 1810 wedding party became the first Oktoberfest.",lore:"Maxvorstadt was Munich\u2019s first planned expansion beyond the old walls, laid out around 1800 under King Max I Joseph. Today it is the city\u2019s brainy, arty quarter: the Alte and Neue Pinakothek, Pinakothek der Moderne and Museum Brandhorst sit a few blocks away, surrounded by thousands of students. A giant pixel creature fits right in among the museums."},{id:"schellingstrasse",name:"Schellingstra\xDFe",motif:"Red Mini Alien",lat:48.1511,lng:11.5778,district:"Maxvorstadt",category:"pixel",hint:"Look up between the student caf\xE9s and bookshops near LMU.",trivia:"The Schelling-Salon, a billiards caf\xE9 on this street, has been open since 1872.",lore:"The street is named after philosopher Friedrich Wilhelm Joseph Schelling. Its old-school Schelling-Salon has served coffee, beer and billiards to generations of students, writers and artists. Tiny invaders love student streets: small, easy to miss, and spotted only by people who look up from their phones."},{id:"gabelsbergerstr",name:"Gabelsbergerstr.",motif:"Blue Giant Alien",lat:48.1485,lng:11.5692,district:"Maxvorstadt",category:"pixel",hint:"Walk the street linking Maxvorstadt\u2019s museums and check wall corners above eye level.",trivia:"Named after Franz Xaver Gabelsberger, inventor of a popular German shorthand system.",lore:"Gabelsberger (1789\u20131849) created a shorthand that was used in parliaments and offices across the German-speaking world for decades. His street runs through the museum quarter \u2014 so this big blue alien is effectively making its own gallery debut, no ticket required."},{id:"muellersches-volksbad",name:"M\xFCller'sches Volksbad",motif:"Isar River Alien",lat:48.132,lng:11.5895,district:"Au-Haidhausen",category:"pixel",hint:"Head to the Isar bank beside the Ludwigsbr\xFCcke and the Art Nouveau bathhouse.",trivia:"This Art Nouveau bathhouse opened in 1901 as a public bath for the people of Munich.",lore:"Engineer Karl M\xFCller funded the bath so that ordinary residents \u2014 many without a bathroom at home \u2014 could wash and swim. More than a century later its vaulted halls, stucco and copper domes are still in use. Perched right on the Isar, it is the natural habitat of a river-loving alien."},{id:"nymphenburg-bridge",name:"Nymphenburg Bridge",motif:"Golden Alien",lat:48.1582,lng:11.5034,district:"Nymphenburg",category:"pixel",hint:"Follow the long palace canal and check around the bridge crossing.",trivia:"In cold winters the palace canal freezes and locals play Eisstockschie\xDFen on the ice.",lore:"Schloss Nymphenburg was begun in 1664 as a summer residence, a gift celebrating the birth of the heir Max Emanuel. The long canal reaches from the palace toward the city, framed by avenues of trees. A golden alien echoes the gilded Baroque rooms inside the palace."},{id:"landsberger-strasse",name:"Landsberger Stra\xDFe",motif:"Westend Pixel Alien",lat:48.1408,lng:11.536,district:"Westend",category:"pixel",hint:"Search the long road west of the Hackerbr\xFCcke, toward the Augustiner brewery.",trivia:"Augustiner \u2014 Munich\u2019s oldest brewery, founded in 1328 \u2014 brews on this street.",lore:"Westend (officially Schwanthalerh\xF6he) grew up as a working-class quarter of breweries, workshops and rail yards. It is now one of Munich\u2019s most multicultural neighbourhoods, where old warehouse walls and courtyards make room for studios and street art."},{id:"werksviertel-mitte",name:"Werksviertel-Mitte",motif:"Loomit 3D Graffiti & Colossal Murals",lat:48.1245,lng:11.606,district:"Ostbahnhof",category:"mural",hint:"Exit Ostbahnhof on the east side and look for the giant Ferris wheel.",trivia:"Before its creative makeover, this site was the Pfanni potato-dumpling factory.",lore:"When food maker Pfanni moved out, its warehouses became the party mile Kunstpark Ost, then the Kultfabrik. Today Werksviertel-Mitte mixes studios, concert halls, a rooftop sheep pasture and the Umadum Ferris wheel. Its walls are painted by big names in the scene \u2014 including Loomit, one of the pioneers of German graffiti since the 1980s."},{id:"tumblingerstrasse",name:"Tumblingerstra\xDFe",motif:"Schlachthof Legal Hall of Fame",lat:48.1228,lng:11.554,district:"Schlachthof",category:"legal",hint:"Find the underpass near the old slaughterhouse grounds \u2014 follow the smell of spray paint.",trivia:"One of Munich\u2019s few legal walls: painted over constantly, so it never looks the same twice.",lore:"The Schlachthofviertel grew around the municipal slaughterhouse and cattle market, opened in 1878. Legal walls like this one give writers a place to practise without risk, turning the spot into a living Hall of Fame where pieces last days, not years. Visit twice and you will see two different galleries."},{id:"muca-museum-wall",name:"MUCA Museum Wall",motif:"Hotterstra\xDFe Giant Urban Wall",lat:48.137,lng:11.5702,district:"Old Town",category:"mural",hint:"Duck into a quiet lane just off the Sendlinger Stra\xDFe shopping street.",trivia:"MUCA opened in 2016 as Germany\u2019s first museum dedicated to urban and contemporary art.",lore:"Collectors Christian and Stephanie Utz turned a former electricity substation in the old town into the Museum of Urban and Contemporary Art. Inside you will find works by internationally known street artists; outside, the fa\xE7ade itself is a rotating canvas for large-scale pieces."},{id:"sophie-scholl-mural",name:"Sophie Scholl Freedom Mural",motif:"Zehentbauernstra\xDFe Portrait",lat:48.1152,lng:11.5788,district:"Giesing",category:"mural",hint:"Wander the streets of Giesing \u2014 she is watching over Zehentbauernstra\xDFe.",trivia:"Sophie Scholl of the White Rose resistance group was executed in 1943, aged 21.",lore:"Sophie Scholl and her brother Hans, students at LMU, were arrested on 18 February 1943 after scattering anti-Nazi leaflets in the university\u2019s atrium. They were executed four days later. The square outside the university\u2019s main building now bears their name \u2014 Geschwister-Scholl-Platz \u2014 and murals like this keep her message of courage visible in everyday streets."},{id:"eisbachwelle-bridge",name:"Eisbachwelle Bridge",motif:"Isar Surfer Graffiti",lat:48.1435,lng:11.5877,district:"Englischer Garten",category:"mural",hint:"Follow the cheering to the bridge at the southern tip of the English Garden.",trivia:"Surfers have ridden a standing river wave here in the city centre for decades.",lore:"The Eisbach is a man-made channel running through the Englischer Garten, one of the largest city parks in the world. Where it rushes out beside the Haus der Kunst, a standing wave forms \u2014 and surfers in wetsuits have been riding it for decades while crowds watch from the bridge. The graffiti here celebrates Munich\u2019s unlikely surf culture."}],U=Object.fromEntries(S.map(e=>[e.id,e])),Re=S.reduce((e,t)=>e+R[t.category].points,0);function K(e,t){let i=p=>p*Math.PI/180,n=i(t.lat-e.lat),s=i(t.lng-e.lng),l=Math.sin(n/2)**2+Math.cos(i(e.lat))*Math.cos(i(t.lat))*Math.sin(s/2)**2;ret @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Press+Start+2P&family=VT323&display=swap');

html, body, #root { height: 100%; margin: 0; background: #141024; }
body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; font-family: 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, a { touch-action: manipulation; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid #ffe08a; outline-offset: 2px; }
select option, select optgroup { font-family: 'Nunito', system-ui, sans-serif; font-size: 15px; color: #141024; }

.font-pixel { font-family: 'Press Start 2P', ui-monospace, monospace; letter-spacing: .02em; }
.font-vt { font-family: 'VT323', ui-monospace, monospace; }

.mq-grid-bg {
  background-color: #1d1934;
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 16px 16px;
}
.mq-scanlines { background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 2px, transparent 2px 4px); }
.mq-noscrollbar { scrollbar-width: none; }
.mq-noscrollbar::-webkit-scrollbar { display: none; }

.mq-press { transition: transform .06s, box-shadow .06s; }
.mq-press:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 #141024 !important; }

@keyframes mq-bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
.mq-bob { animation: mq-bob 1.2s steps(2) infinite; }
@keyframes mq-bump { 0% { transform: scale(.85) } 60% { transform: scale(1.1) } 100% { transform: scale(1) } }
.mq-bump { animation: mq-bump .35s steps(4); }
@keyframes mq-blink { 50% { opacity: 0 } }
.mq-blink { animation: mq-blink 1s steps(1) infinite; }
@keyframes mq-spin { to { transform: rotate(360deg) } }
.mq-spin { animation: mq-spin 1s steps(8) infinite; }
@keyframes mq-laser { 0% { top: 8% } 50% { top: 90% } 100% { top: 8% } }
.mq-laser { top: 8%; animation: mq-laser 2.4s ease-in-out infinite; }
@keyframes mq-fill { from { width: 0 } to { width: 100% } }
.mq-fill { width: 0; animation: mq-fill linear forwards; }
@keyframes mq-pop { 0% { transform: scale(.7); opacity: 0 } 70% { transform: scale(1.04); opacity: 1 } 100% { transform: scale(1) } }
.mq-pop { animation: mq-pop .32s steps(5); }
@keyframes mq-drawer-in { from { transform: translateY(105%) } to { transform: translateY(0) } }
.mq-drawer-in { animation: mq-drawer-in .26s cubic-bezier(.2,.9,.3,1.15); }
@keyframes mq-toast { 0% { transform: translateY(-12px); opacity: 0 } 100% { transform: translateY(0); opacity: 1 } }
.mq-toast { animation: mq-toast .2s steps(3); }
@keyframes mq-fade-in { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: none } }
.mq-fade-in { animation: mq-fade-in .2s ease-out; }

.mq-loader { position: relative; width: 48px; height: 48px; }
.mq-loader span { position: absolute; width: 12px; height: 12px; background: #b9a3ff; opacity: .2; animation: mq-loader .8s steps(1) infinite; }
.mq-loader span:nth-child(1) { left: 0; top: 0 }      .mq-loader span:nth-child(2) { left: 18px; top: 0 }
.mq-loader span:nth-child(3) { left: 36px; top: 0 }   .mq-loader span:nth-child(4) { left: 36px; top: 18px }
.mq-loader span:nth-child(5) { left: 36px; top: 36px } .mq-loader span:nth-child(6) { left: 18px; top: 36px }
.mq-loader span:nth-child(7) { left: 0; top: 36px }   .mq-loader span:nth-child(8) { left: 0; top: 18px }
@keyframes mq-loader { 0% { opacity: 1; background: #ff9ecf } 12% { opacity: .55; background: #b9a3ff } 25%, 100% { opacity: .2 } }

.mq-confetti { position: absolute; top: -16px; box-shadow: 2px 2px 0 rgba(20,16,36,.6); animation-name: mq-fall; animation-timing-function: cubic-bezier(.25,.6,.45,1); animation-fill-mode: forwards; }
@keyframes mq-fall { to { transform: translate(var(--drift), 105dvh) rotate(var(--spin)); } }

/* ---- Leaflet overrides ---- */
.leaflet-container { background: #1b1830; font-family: 'Nunito', system-ui, sans-serif; }
.leaflet-container img { max-width: none !important; max-height: none !important; }
.leaflet-control-attribution { background: rgba(20,16,36,.75) !important; color: #a99fcf !important; font-size: 9px !important; line-height: 1.3 !important; }
.leaflet-control-attribution a { color: #ff9ecf !important; }
.mq-pin-wrap { background: none !important; border: none !important; }
.mq-pin { position: relative; width: 40px; height: 44px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.mq-pin-head { position: relative; width: 36px; height: 36px; display: grid; place-items: center; background: var(--pin); border: 3px solid #141024; box-shadow: 3px 3px 0 #141024; font-size: 18px; line-height: 1; }
.mq-pin-tail { position: relative; width: 12px; height: 4px; background: #141024; }
.mq-pin-tail::after { content: ''; position: absolute; left: 4px; top: 4px; width: 4px; height: 4px; background: #141024; }
.mq-pin-badge { position: absolute; top: -9px; right: -9px; width: 17px; height: 17px; display: grid; place-items: center; font-style: normal; font-size: 9px; line-height: 1; background: #fff7fb; border: 2px solid #141024; color: #141024; }
.is-unlocked .mq-pin-badge { background: #ffe08a; font-size: 11px; }
.is-locked .mq-pin-head > span { filter: grayscale(.85) brightness(.9); opacity: .85; }
.is-locked .mq-pin-head { background: color-mix(in srgb, var(--pin) 45%, #3a3363); }
.is-selected { animation: mq-hop .7s steps(2) infinite; }
.is-selected .mq-pin-head { outline: 3px solid #fff7fb; outline-offset: 2px; }
@keyframes mq-hop { 50% { transform: translateY(-6px) } }

.mq-sketch {
  background-color: #1b1830 !important;
  background-image: linear-gradient(rgba(185,163,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(185,163,255,.06) 1px, transparent 1px);
  background-size: 24px 24px;
}
.mq-label { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-family: 'VT323', ui-monospace, monospace; font-size: 15px; line-height: 1; letter-spacing: .08em; text-transform: uppercase; color: #8a80b8; text-shadow: 2px 2px 0 #141024; pointer-events: none; }
.mq-label.big { font-size: 19px; color: #c9bff0; }
.mq-label.water { color: #9fd8ff; font-style: italic; }
.mq-label.park { color: #8ff0c8; font-size: 14px; }
.mq-label.stn { color: #ffe08a; font-size: 14px; }

.mq-user { position: relative; width: 22px; height: 22px; }
.mq-user-dot { position: absolute; inset: 3px; background: #9fd8ff; border: 3px solid #141024; }
.mq-user-ring { position: absolute; inset: -6px; border: 3px solid #9fd8ff; animation: mq-ring 1.6s ease-out infinite; }
@keyframes mq-ring { from { transform: scale(.6); opacity: .9 } to { transform: scale(1.6); opacity: 0 } }

@media (prefers-reduced-motion: reduce) {
  .mq-confetti, .mq-laser { display: none; }
